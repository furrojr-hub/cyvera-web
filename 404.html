<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada · Cyvera</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{--ground:#ECEEEC;--ink:#101614;--muted:#6D7A74;--accent:#0E6B54;--line:#CAD2CC}
  @media (prefers-color-scheme:dark){
    :root{--ground:#0B100F;--ink:#E9EEEB;--muted:#8A978F;--accent:#46C39D;--line:#283330}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 20px;
    background:var(--ground);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.6}
  main{max-width:46ch}
  p.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  h1{font-family:"Syne","Trebuchet MS",sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);letter-spacing:-.03em;line-height:1.02;margin:0 0 16px}
  p.lede{margin:0 0 26px;color:var(--ink)}
  a{display:inline-flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
    letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:11px 18px}
  a:hover{border-color:var(--accent);color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Esta página no existe</h1>
  <p class="lede">El enlace está roto o la página se movió. Si llegaste buscando un servicio o un caso, está todo en la portada.</p>
  <a href="/">Volver a Cyvera</a>
</main>
</body>
</html>
